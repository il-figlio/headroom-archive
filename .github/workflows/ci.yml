name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build universal app and test
    # Pinned image and Xcode; bump both together (see docs/releases.md).
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Select Xcode 26.5
        run: |
          sudo xcode-select -s /Applications/Xcode_26.5.app
          xcodebuild -version
          swift --version

      - name: Build universal app (ad-hoc signed)
        run: HEADROOM_SIGN_IDENTITY=- ./scripts/build.sh

      - name: Swift Testing checks
        run: ./scripts/check.sh

      - name: XCTest suite
        run: ./scripts/test.sh

      - name: Release packaging dry run (ZIP, DMG, signed appcast, cask; throwaway key)
        run: |
          ./scripts/sparkle-tools.sh
          ./scripts/release.py dry-run
